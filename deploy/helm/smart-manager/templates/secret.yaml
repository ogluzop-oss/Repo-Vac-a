{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Generado SOLO si secrets.create=true y no hay existingSecret. Para PRUEBAS; en producción usa un
# gestor de secretos externo (Sealed Secrets / External Secrets / Secret Manager del cloud).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smart-manager.fullname" . }}-secrets
  labels:
    {{- include "smart-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
