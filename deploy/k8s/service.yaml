# Service ClusterIP: expone el backend (puerto 80 → contenedor 8000).
apiVersion: v1
kind: Service
metadata:
  name: smart-manager-backend
  namespace: smart-manager
  labels:
    app.kubernetes.io/name: smart-manager
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smart-manager
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
