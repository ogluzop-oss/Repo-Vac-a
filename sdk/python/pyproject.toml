[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmanager"
version = "1.0.0"
description = "SDK oficial de Python para la Enterprise REST API de Smart Manager AI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "Smart Manager AI" }]
keywords = ["smartmanager", "erp", "sdk", "rest", "api"]
dependencies = []

[project.urls]
Homepage = "https://github.com/smartmanager-ai"
Documentation = "https://api.tu-dominio/api/v1/docs"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["smartmanager"]
